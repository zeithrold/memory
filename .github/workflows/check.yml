name: Check and Deploy
on:
  push:
  pull_request:
jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          node -e 'const fs = require("node:fs"); fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${require("@playwright/test/package.json").version}\n`)'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ steps.playwright-version.outputs.version }}-chromium-v1
      # Installation reuses cached browsers; Linux system dependencies still
      # need to be installed on each fresh runner.
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.1
          cache: false
      - name: Install pinned frontend CLI
        run: |
          go install github.com/zeithrold/tools/cmd/zt@3f9a3a7d33befc5a954ba1e86d3aa6d72e2c762f
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # zt runs each native gate once; two browser suites use distinct builds.
      - run: pnpm check
        env:
          MEMORY_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Show failed native frontend checks
        if: failure()
        run: pnpm exec tsx scripts/show-check-failures.ts
      - run: pnpm test:artifacts
      - name: Retain frontend verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-verification-${{ github.sha }}
          path: .zt/artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Build and deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm run deploy
        env:
          NEXT_PUBLIC_ACCESS_TEAM_DOMAIN: ${{ secrets.NEXT_PUBLIC_ACCESS_TEAM_DOMAIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Optional. Without SENTRY_AUTH_TOKEN the source-map upload is skipped
          # and the build still succeeds.
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ github.sha }}
