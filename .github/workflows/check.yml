name: CI & Deploy
on:
  push:
  pull_request:
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the workflow commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Go for verification
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.27.1
          cache: false
      - name: Install reviewed zt CLI
        env:
          GOBIN: ${{ runner.temp }}/zt-bin
        run: |
          go install github.com/zeithrold/tools/cmd/zt@3f9a3a7d33befc5a954ba1e86d3aa6d72e2c762f
          printf '%s\n' "$GOBIN" >> "$GITHUB_PATH"
      - name: Record verification provenance
        run: |
          pnpm exec tsx scripts/verification-metadata.ts
          go version -m "$(command -v zt)" > .zt/artifacts/zt-toolchain.txt
        env:
          MEMORY_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          node -e 'const fs = require("node:fs"); fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${require("@playwright/test/package.json").version}\n`)'
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ steps.playwright-version.outputs.version }}-chromium-v1
      # Cached browsers still require Linux dependencies on each fresh runner.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # The final required integration gate verifies deliberate-failure evidence retention.
      - name: Verify frontend and production Worker
        run: pnpm check
        env:
          MEMORY_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Show failed native checks
        if: failure()
        run: pnpm exec tsx scripts/show-check-failures.ts
      # Review only: Deploy downloads outside dist and rebuilds with production settings.
      - name: Upload verified build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: worker-verification-${{ github.sha }}
          path: |
            dist/
            .zt/artifacts/metadata.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload frontend verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: .zt/artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the workflow commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download the tested Worker
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: worker-verification-${{ github.sha }}
          path: .zt/verified-build
      - name: Verify deployment boundaries
        run: pnpm exec tsx scripts/check-verified-build.ts
      # The existing command checks targets, builds production auth/Sentry settings,
      # verifies Workflow exports and deploys. Preview artifacts never populate dist.
      - name: Deploy the tested Worker
        run: pnpm run deploy
        env:
          NEXT_PUBLIC_ACCESS_TEAM_DOMAIN: ${{ secrets.NEXT_PUBLIC_ACCESS_TEAM_DOMAIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ github.sha }}
      # Memory has no unauthenticated live-version acceptance endpoint; this checks
      # the production bundle contract without expanding token or Access scopes.
      - name: Verify production Worker bundle after deployment
        run: pnpm check:bundle
