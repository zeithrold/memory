name: Check and Deploy
on:
  push:
  pull_request:
jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          node -e 'const fs = require("node:fs"); fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${require("@playwright/test/package.json").version}\n`)'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ steps.playwright-version.outputs.version }}-chromium-v1
      # Installation reuses cached browsers; Linux system dependencies still
      # need to be installed on each fresh runner.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # `test:e2e` builds the preview, so the artifact the guard inspects exists.
      # The deploy step repeats it against the production build.
      - run: pnpm check:bundle
      - name: Build and deploy
        run: pnpm run deploy
        env:
          NEXT_PUBLIC_ACCESS_TEAM_DOMAIN: ${{ secrets.NEXT_PUBLIC_ACCESS_TEAM_DOMAIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Optional. Without SENTRY_AUTH_TOKEN the source-map upload is skipped
          # and the build still succeeds.
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ github.sha }}
