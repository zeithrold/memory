minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@ztd-me/*'

trustPolicy: no-downgrade
# @sentry/vite-plugin -> @babel/core -> semver@6.3.1, a frozen package whose
# publish predates provenance attestation. Scoped to that single version; the
# dependency is build-time only.
trustPolicyExclude:
  - semver@6.3.1

shellEmulator: true

patchedDependencies:
  '@radix-ui/react-select@2.3.7': components/ui/ztd-me/patches/@radix-ui__react-select@2.3.7.patch
  vaul@1.1.2: components/ui/ztd-me/patches/vaul@1.1.2.patch

allowBuilds:
  '@sentry/cli': false
  esbuild: true
  workerd: true
