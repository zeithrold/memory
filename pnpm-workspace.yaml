minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@ztd-me/*'

trustPolicy: no-downgrade
# @sentry/vite-plugin -> @babel/core -> semver@6.3.1, a frozen package whose
# publish predates provenance attestation. Scoped to that single version; the
# dependency is build-time only.
trustPolicyExclude:
  - semver@6.3.1

shellEmulator: true

allowBuilds:
  '@sentry/cli': false
  esbuild: true
  workerd: true
